name: Dependency Review

# ─────────────────────────────────────────────────────────────────────────────
# DISABLED — DO NOT RE-ENABLE. Standing operator decision (see CLAUDE.md → "CI
# policy"). GitHub Actions is turned OFF for this repository. The automatic
# `pull_request` trigger was replaced with `workflow_dispatch` (manual only) so
# re-enabling Actions does not silently resurrect this check.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
