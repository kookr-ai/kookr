name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PERSONAL_ACCESS_TOKEN must be a PAT with `repo` scope on the
          # signatures repo. Create at https://github.com/settings/tokens and
          # add as a repo secret named PERSONAL_ACCESS_TOKEN.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/kookr-ai/kookr/blob/main/CLA.md'
          branch: 'main'
          allowlist: bot*,dependabot[bot]
          remote-organization-name: kookr-ai
          remote-repository-name: cla-signatures
          custom-notsigned-prcomment: 'Thanks for your contribution! Before we can merge, please read our [Contributor License Agreement](https://github.com/kookr-ai/kookr/blob/main/CLA.md) and sign it by posting the following comment on this PR:'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
          lock-pullrequest-aftermerge: false
