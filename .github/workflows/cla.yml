name: CLA Assistant

# NOTE: GitHub Actions is turned OFF for this repository (standing operator
# decision — see CLAUDE.md → "CI policy"), so this workflow does not currently
# run. Its automatic triggers are INTENTIONALLY LEFT INTACT — this is a legal
# CLA collector for outside contributors, not a test/CI gate, and it must work
# again as-is if Actions is ever re-enabled for legal reasons. Do not neuter its
# triggers as part of the CI-disable policy.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The env var name MUST be PERSONAL_ACCESS_TOKEN — the action reads
          # it internally (process.env.PERSONAL_ACCESS_TOKEN) and renaming it
          # silently breaks remote-signature writes. The repo secret on the
          # right side can be named anything; we use KOOKR_CLA_ASSISTANT_TOKEN
          # so future scoped PATs in this repo don't clash.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.KOOKR_CLA_ASSISTANT_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/kookr-ai/kookr/blob/main/CLA.md'
          branch: 'main'
          allowlist: bot*,dependabot[bot]
          remote-organization-name: kookr-ai
          remote-repository-name: cla-signatures
          custom-notsigned-prcomment: 'Thanks for your contribution! Before we can merge, please read our [Contributor License Agreement](https://github.com/kookr-ai/kookr/blob/main/CLA.md) and sign it by posting the following comment on this PR:'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
          lock-pullrequest-aftermerge: true
