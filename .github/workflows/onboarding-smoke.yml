name: Onboarding Smoke Test

# NOTE: GitHub Actions is turned OFF for this repository (standing operator
# decision — see CLAUDE.md → "CI policy"), so this workflow cannot run even
# manually. It was already `workflow_dispatch`-only and is left unchanged. Do
# not re-enable Actions or add automatic triggers.
on:
  workflow_dispatch: # manual trigger only — requires API credits

concurrency:
  group: onboarding-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Exercises the README "Quick Start → Install & Run" path on clean
  # ubuntu-latest AND macos-latest runners so missing prerequisites surface
  # on both supported platforms (scripts/doctor.sh covers Linux + macOS)
  # before the heavyweight Docker-based smoke test runs (issue #101).
  # fail-fast: false so one OS failing doesn't mask the other.
  prereq-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (README "Install & Run")
        run: pnpm install --frozen-lockfile

      - name: Kookr doctor (must exit 0)
        run: pnpm run doctor

  onboarding-test:
    needs: prereq-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Run onboarding smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ONBOARDING_CONTAINER_AGENT_SMOKE: "1"
          REPORT_DIR: ${{ runner.temp }}
        run: bash scripts/onboarding-smoke-test.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onboarding-report
          path: ${{ runner.temp }}/onboarding-report*.md
          retention-days: 30

      - name: Upload hook log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onboarding-hooks
          path: ${{ runner.temp }}/onboarding-hooks-*
          retention-days: 7

      - name: Comment on commit (failure only)
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync(process.env.RUNNER_TEMP)
              .filter(f => f.startsWith('onboarding-report'));
            const report = reports.length > 0
              ? fs.readFileSync(`${process.env.RUNNER_TEMP}/${reports[0]}`, 'utf8')
              : 'Report not generated.';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## Onboarding Smoke Test Failed\n\n<details><summary>Full report</summary>\n\n${report}\n\n</details>\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            });
