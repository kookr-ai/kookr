name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Path filtering runs as a step inside each job rather than as a dedicated
# filter job: every job occupies a runner slot, and with concurrent agent PRs
# the 20-job concurrency limit made queue wait rival execution time. The
# filter step only runs on pull_request (paths-filter resolves changed files
# via the API there); on push its outputs are empty, so gates use
# `!= 'false'` to fail open — push to main always runs everything.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'src/**'
              - 'relay/**'
              - 'scripts/**'
              - 'e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vitest.config.ts'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
            hooks:
              - '.claude/**'
              - '.hooks/**'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check server
        if: steps.filter.outputs.code != 'false'
        run: pnpm build:server

      - name: Type-check E2E tests
        if: steps.filter.outputs.code != 'false'
        run: pnpm check:e2e

      # The four validators are cheap (<2s each) and cover docs/skills-only
      # changes, so they run unconditionally.
      - name: Validate skill frontmatter
        run: pnpm validate:skills

      - name: Validate documented commands
        run: pnpm validate:docs-commands

      - name: Validate documented environment variables
        run: pnpm validate:docs-env-vars

      - name: Validate requirements status matrix
        run: pnpm validate:requirements

      # Reporter list and reportOnFailure live in vitest.config.ts so local
      # `pnpm test:coverage` and CI produce the same artifacts. `--coverage`
      # is the only flag this step adds; do not re-pass reporters here or
      # the CLI list will override the config and they will drift.
      - name: Run tests with coverage
        if: steps.filter.outputs.code != 'false'
        run: pnpm exec vitest run --coverage

      - name: Upload coverage artifacts
        if: always() && steps.filter.outputs.code != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

      - name: Summarize coverage
        if: always() && steps.filter.outputs.code != 'false'
        run: pnpm coverage:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Run local-only smoke gates
        if: steps.filter.outputs.code != 'false'
        run: pnpm test:smoke
        env:
          KOOKR_RELAY_URL: ''
          KOOKR_FAKE_TERMINAL: 'false'
          KOOKR_USE_FAKE_AGENT: 'false'

      - name: Run hook regression tests
        if: steps.filter.outputs.code != 'false' || steps.filter.outputs.hooks == 'true'
        run: pnpm test:hooks

  build:
    runs-on: ubuntu-latest
    # A red E2E suite with retries + trace capture has run 27+ minutes;
    # green runs finish in ~5. Cap the job well above green-path time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            e2e:
              - 'src/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'playwright.config.ts'
              - 'vite.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'

      - uses: pnpm/action-setup@v6
        if: steps.filter.outputs.e2e != 'false'

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.e2e != 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.filter.outputs.e2e != 'false'
        run: pnpm install --frozen-lockfile

      # prod-restart.spec.ts and resolve-listen-port.ts shell out to lsof.
      # ubuntu-latest ships it preinstalled; this is a no-op guard in case a
      # future runner image drops it.
      - name: Ensure lsof
        if: steps.filter.outputs.e2e != 'false'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.filter.outputs.e2e != 'false'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.filter.outputs.e2e != 'false' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.filter.outputs.e2e != 'false' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Build
        if: steps.filter.outputs.e2e != 'false'
        run: pnpm build

      # --max-failures on PRs makes a systemically broken suite fail fast
      # instead of retrying every spec with trace capture. Push to main runs
      # unbounded so the post-merge signal is a complete failure report.
      - name: Run E2E tests
        if: steps.filter.outputs.e2e != 'false'
        run: pnpm exec playwright test ${{ github.event_name == 'pull_request' && '--max-failures=10' || '' }}

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
