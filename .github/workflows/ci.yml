name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke-filter:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'

  smoke:
    needs: smoke-filter
    if: github.event_name != 'pull_request' || needs.smoke-filter.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local-only smoke gates
        run: pnpm test:smoke
        env:
          KOOKR_RELAY_URL: ''
          KOOKR_FAKE_TERMINAL: 'false'
          KOOKR_USE_FAKE_AGENT: 'false'

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check server
        run: pnpm build:server

      - name: Type-check E2E tests
        run: pnpm check:e2e

      - name: Validate skill frontmatter
        run: pnpm validate:skills

      - name: Validate documented commands
        run: pnpm validate:docs-commands

      # Reporter list and reportOnFailure live in vitest.config.ts so local
      # `pnpm test:coverage` and CI produce the same artifacts. `--coverage`
      # is the only flag this step adds; do not re-pass reporters here or
      # the CLI list will override the config and they will drift.
      - name: Run tests with coverage
        run: pnpm exec vitest run --coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

      - name: Summarize coverage
        if: always()
        run: pnpm coverage:summary >> "$GITHUB_STEP_SUMMARY"

      - name: Run hook regression tests
        run: pnpm test:hooks

  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6

      # Inside the playwright container the working tree is owned by a
      # different uid than the user running the steps; without this, every
      # `git` invocation (the prepare hook, scripts/generate-build-info.ts,
      # etc.) fails with "fatal: detected dubious ownership in repository".
      - name: Mark workspace as a git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install native build tools
        run: apt-get update && apt-get install -y build-essential lsof

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
