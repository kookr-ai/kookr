# STT service stack for Kookr — started automatically when KOOKR_STT=true.
#
# Two services:
#   1. kookr-stt-whisper: Faster-Whisper HTTP sidecar (GPU + large-v3 by default)
#   2. kookr-stt: Node.js WebSocket server that wraps whisper with progressive streaming
#
# Requires an NVIDIA GPU with the NVIDIA Container Toolkit installed.
# To run on CPU instead, override these env vars before `docker compose up`:
#   WHISPER_IMAGE=fedirz/faster-whisper-server:latest-cpu
#   WHISPER_MODEL=base WHISPER_DEVICE=cpu WHISPER_COMPUTE_TYPE=int8
# (and remove the GPU device reservation from kookr-stt-whisper).
#
# The model (~2.9 GB for large-v3) is cached in the kookr_stt_whisper_cache
# volume so it only downloads on first run.

services:
  kookr-stt-whisper:
    image: ${WHISPER_IMAGE:-fedirz/faster-whisper-server:latest-cuda}
    container_name: kookr-stt-whisper
    # Bind to localhost so the Kookr Node process can POST OGG voice
    # messages from Telegram directly to the OpenAI-compatible endpoint.
    # See issue #574; we deliberately do NOT expose 0.0.0.0 — this is
    # a local-only sidecar.
    ports:
      - "127.0.0.1:${KOOKR_STT_WHISPER_PORT:-8010}:8010"
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER__INFERENCE_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER__COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
      UVICORN_PORT: "8010"
    volumes:
      - kookr_stt_whisper_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  kookr-stt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kookr-stt
    ports:
      - "${KOOKR_STT_PORT:-8003}:8003"
    environment:
      STT_BACKEND: whisper
      WHISPER_URL: http://kookr-stt-whisper:8010
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_TIMEOUT_MS: "30000"
      PORT: "8003"
      DEFAULT_LANGUAGE: ${STT_LANGUAGE:-en}
      PROGRESSIVE_INTERVAL: "0.5"
      MAX_WINDOW_SIZE: "15.0"
      SENTENCE_BUFFER: "2.0"
      MIN_AUDIO_SECONDS: "0.5"
    depends_on:
      kookr-stt-whisper:
        condition: service_started
    restart: unless-stopped

volumes:
  kookr_stt_whisper_cache:
